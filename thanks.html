<head>

<meta property="og:description" content="Grid applications, STC packs and SAA-accredited solar design for Queensland electricians. Pay per job, first job free.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d2440">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://pocket-backup.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column landing; switchboard-panel motif (labelled circuits) for services; free checker as the interactive centrepiece. */
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#1d2440; --muted:#5b6490; --line:#dcdbe3;
  --accent:#ffd23f; --accent-ink:#1d2440; --band:#1d2440; --band-ink:#f7f5f0; --band-muted:#aab1cf;
  --ok:#2f8a4f; --ok-bg:#e4f2e8; --bad:#b9382f; --bad-bg:#f8e2df;
  --f-display:"Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11152a; --panel:#1a2038; --ink:#eceef6; --muted:#a3aac8; --line:#2b3252;
  --accent:#ffd23f; --accent-ink:#1d2440; --band:#0b0e1f; --band-ink:#f7f5f0; --band-muted:#a3aac8;
  --ok:#5cc07f; --ok-bg:#1c3325; --bad:#f07068; --bad-bg:#3b1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11152a; --panel:#1a2038; --ink:#eceef6; --muted:#a3aac8; --line:#2b3252;
  --accent:#ffd23f; --accent-ink:#1d2440; --band:#0b0e1f; --band-ink:#f7f5f0; --band-muted:#a3aac8;
  --ok:#5cc07f; --ok-bg:#1c3325; --bad:#f07068; --bad-bg:#3b1f1d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:64px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(38px,6vw,64px);font-weight:700}
h2{font-size:clamp(28px,4vw,40px)}
h3{font-size:22px}
p{margin:0;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:16px}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--f-body);border-radius:6px;padding:12px 20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}

/* top */
.top{background:var(--band);color:var(--band-ink)}
.top .bar{display:flex;align-items:center;gap:16px;padding-block:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;gap:10px;align-items:center}
.brand img{display:block;height:46px;width:auto}
.top nav{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.top nav a{color:var(--band-muted);text-decoration:none} .top nav a:hover{color:var(--band-ink)}
.hero{padding-block:56px 72px;display:grid;gap:24px}
.hero p{color:var(--band-muted);font-size:19px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn:not(.primary){background:transparent;color:var(--band-ink);border-color:#3a4470}
.creds{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--f-mono);font-size:13px;color:var(--band-muted)}
.creds span::before{content:"■ ";color:var(--accent)}

/* switchboard services */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.cb{padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:8px;align-content:start}
.cb .lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cb .price{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.cb .price small{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.cb p{font-size:15px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--panel);display:grid;gap:4px}
.plan .price{font-family:var(--f-display);font-size:28px;font-weight:600}
.plan.free{border-color:var(--accent);border-width:2px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;counter-reset:s}
.step{display:grid;gap:6px;counter-increment:s}
.step::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:20px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.step p{font-size:15px;color:var(--muted)}

/* checker */
.checker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
@media (max-width:760px){.checker{grid-template-columns:1fr}}
.qs{display:grid;gap:14px}
.q{display:grid;gap:6px;font-size:15px}
.q > span{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
.opts input{accent-color:var(--accent)}
.opts label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.result{display:grid;gap:10px;align-content:start}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.items li{display:flex;gap:8px;align-items:flex-start}
.items li b{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border-radius:4px;flex:none;margin-top:3px}
.items li.ok b{background:var(--ok-bg);color:var(--ok)} .items li.no b{background:var(--bad-bg);color:var(--bad)}
.verdict{font-family:var(--f-display);font-size:22px;font-weight:600}

/* why */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.why div{display:grid;gap:6px;border-top:3px solid var(--accent);padding-top:12px}
.why p{font-size:15px;color:var(--muted)}

/* contact */
.contact{background:var(--band);color:var(--band-ink)}
.contact p{color:var(--band-muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cc{border:1px solid #343d66;border-radius:8px;padding:16px;display:grid;gap:8px}
.cc .v{font-family:var(--f-mono);font-size:17px;color:var(--band-ink);word-break:break-all}
.cc button{justify-self:start;font:600 14px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:6px 12px;cursor:pointer}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border:1px solid #343d66;border-radius:8px;padding:20px}
.form label{display:grid;gap:6px;font-size:14px;color:var(--band-muted)}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{font:16px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.form textarea{min-height:96px;resize:vertical}
.form .hp{display:none}
footer{background:var(--band);color:var(--band-muted);font-size:13px;padding-block:20px 32px;border-top:1px solid #2b3252}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in bar"><a class="brand" href="/" style="text-decoration:none"><img src="/brand/pocket-backup-logo-dark.svg" alt="Pocket Backup" width="122" height="46"></a></div>
<div class="in hero"><span class="eyebrow" style="color:var(--band-muted)">Message received</span><h1>Thanks, I'll be in touch.</h1><p>I'll call or text you within one business day to book your free 15-minute call. Your first job is free.</p><div class="row"><a class="btn primary" href="/">Back to the site</a></div></div></div>
</body></html>
